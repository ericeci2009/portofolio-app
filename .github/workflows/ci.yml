name: my first pipeline

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

        - name: uptime
          run: uptime
        - name: Number processor
          run: nproc
  test:
    runs-on: ubuntu-latest
    steps:
        - name: checkout code
          uses: actions/checkout@4
        - name:  Build image 
          run: docker build -t ericeci2009/ciportofolio .
        - name: List images
          run: docker images        

